name: Build and Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Core Tests with CMake
      run: cmake --build build --config Release --target PerfUI_Test_Independence PerfUI_Test_Layout PerfUI_Bench_ImGui PerfUI_Test_Markup

    - name: Run CTest Suite
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Build Standalone Tests with XMake
      run: |
        xmake f -m release
        xmake build PerfUI_Test_Independence
        xmake build PerfUI_Test_Layout
        xmake build PerfUI_Bench_ImGui
        xmake build PerfUI
        xmake run PerfUI_Test_Independence
        xmake run PerfUI_Test_Layout
        xmake run PerfUI_Bench_ImGui
        xmake run PerfUI_Test_Markup

    - name: Verify Out-of-Tree Modder Custom HUD Build with SDK
      shell: pwsh
      run: |
        $repoRoot = (Get-Item .).FullName
        $env:PERFUI_SDK = "$repoRoot/sdk"
        $tempDir = Join-Path $env:TEMP "modder_custom_hud_ci"
        Copy-Item -Recurse -Force "examples/modder_custom_hud" $tempDir
        Push-Location $tempDir
        try {
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
        } finally {
            Pop-Location
            Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
        }

    - name: Prepare Release Artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "artifact/sdk/include" -Force
        New-Item -ItemType Directory -Path "artifact/sdk/lib" -Force
        Copy-Item -Recurse -Path "sdk/include/*" -Destination "artifact/sdk/include"
        Copy-Item -Path "sdk/lib/PerfUI.lib" -Destination "artifact/sdk/lib"
        Copy-Item -Path "build/windows/x64/release/PerfUI.dll" -Destination "artifact/" -ErrorAction SilentlyContinue
        Copy-Item -Path "LICENSE" -Destination "artifact/"
        Copy-Item -Path "README.md" -Destination "artifact/"
        Compress-Archive -Path "artifact/*" -DestinationPath "PerfUI-${{ github.ref_name }}.zip"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: PerfUI-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build & Test (Linux ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-12
            cxx: g++-12
          - compiler: clang
            cc: clang-15
            cxx: clang++-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Compilers
      run: |
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          sudo apt-get install -y gcc-12 g++-12
        else
          sudo apt-get install -y clang-15 llvm-15
        fi

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Core Tests
      run: cmake --build build --config Release --target PerfUI_Test_Independence PerfUI_Test_Layout PerfUI_Bench_ImGui PerfUI_Test_Markup

    - name: Run Tests (CTest)
      run: ctest --test-dir build -C Release --output-on-failure
