[Diagnostics]
; Enable the diagnostics overlay
bEnabled = 1

; Toggle hotkey: 0x76 = VK_F7, 0x75 = VK_F6, 0x77 = VK_F8, 0x79 = VK_F10, 0x7A = VK_F11
iToggleHotkey = 0x76

; Enable hardware D3D11 backdrop blur (Liquid Glass). Set to 0 on low-end GPUs for basic translucency.
bEnableGlassBlur = 1

; Blur multiplier (0.5 to 3.0)
fBlurScale = 1.0

; Path to the XML template with Hot-Reload support
sTemplatePath = SKSE/Plugins/PerfUI/ui/diagnostics.xml

[PostFx]
; Global D3D11 Backdrop Blur master switch
bEnableBackdropBlur = 1

; Number of Kawase filter passes (3 for fast, 5 for ultra-soft silky glass)
iKawasePasses = 5
